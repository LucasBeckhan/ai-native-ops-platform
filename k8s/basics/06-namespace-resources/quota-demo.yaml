# 多租户四件套之 Quota+LimitRange（模块 6 实测）
apiVersion: v1
kind: ResourceQuota
metadata: {name: rq, namespace: quota-ns}
spec:
  hard:
    pods: "3"                    # 对象数配额
    requests.cpu: "500m"         # 资源总量配额
    limits.memory: 1Gi
---
apiVersion: v1
kind: LimitRange
metadata: {name: lr, namespace: quota-ns}
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 128Mi}          # 未写 limits 时注入
      defaultRequest: {cpu: 100m, memory: 64Mi}    # 未写 requests 时注入
      max: {cpu: "2", memory: 2Gi}                 # 单容器上限
---
apiVersion: v1
kind: Pod
metadata: {name: q1, namespace: quota-ns}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 100m, memory: 64Mi}    # requests==limits → Guaranteed QoS
