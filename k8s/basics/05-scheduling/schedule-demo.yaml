# 调度演示（模块 5 实测调度成功）：先给节点打标签 node-type=core
apiVersion: v1
kind: Pod
metadata: {name: schedule-demo}
spec:
  nodeSelector: {node-type: core}          # 预选硬约束
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
  # 优选打分示例（软偏好）：反亲和把同类 Pod 打散
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector: {matchLabels: {app: web}}
            topologyKey: kubernetes.io/hostname
