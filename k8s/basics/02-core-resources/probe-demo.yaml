# 三探针组合（模块 2 实测通过）：详细语义见 docs-basics.md 2.1
apiVersion: apps/v1
kind: Deployment
metadata: {name: probe-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: probe-demo}}
  template:
    metadata: {labels: {app: probe-demo}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          startupProbe:   # 慢启动窗口：通过前不跑 liveness（防误杀）
            httpGet: {path: /, port: 80}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:  # 失败 → 重启容器（自愈）
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          readinessProbe: # 失败 → 摘除 Endpoints（不接流量不重启）
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
