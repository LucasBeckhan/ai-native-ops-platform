# NetworkServiceChain CRD（场景四）：kubectl apply 后 Operator 开始收敛
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkservicechains.nfv.teleops.io
spec:
  group: nfv.teleops.io
  names:
    kind: NetworkServiceChain
    plural: networkservicechains
    shortNames: [nsc]
    singular: networkservicechain
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: ReadyHops
          type: integer
          jsonPath: .status.readyHops
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [functions]
              properties:
                ingress:
                  type: string
                  description: 流量入口（分类器标识）
                functions:
                  type: array
                  description: 服务链跳序（流量依次经过）
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [firewall, ids, loadbalancer]
                      port:
                        type: integer
                      replicas:
                        type: integer
            status:
              type: object
              properties:
                phase: {type: string}
                readyHops: {type: integer}
                message: {type: string}
---
# 示例实例：防火墙 → IDS → 负载均衡 的经典三跳链
apiVersion: nfv.teleops.io/v1
kind: NetworkServiceChain
metadata:
  name: edge-sfc-01
spec:
  ingress: edge-classifier-a
  functions:
    - {type: firewall, port: 8080, replicas: 2}
    - {type: ids, port: 8080, replicas: 2}
    - {type: loadbalancer, port: 80, replicas: 3}
